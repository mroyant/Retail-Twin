# Magasin fictif de démo (40 m × 25 m). Coordonnées plan en mètres, origine en bas à gauche.
#
#   y=25 ┌──────────────────────────────────────────┐
#        │   TG   allées 01..05        comptoir fromage│
#        │  ┌┐  ┌┐  ┌┐  ┌┐  ┌┐          (service)    │
#        │  ││  ││  ││  ││  ││          (approche)   │
#        │  └┘  └┘  └┘  └┘  └┘                       │
#        │        files caisses 1, 2                 │
#   y=0  └ entrée ──── caisses / sortie ─────────────┘
#        x=0                                      x=40

magasin:
  id: demo-01
  nom: Supermarché démo
  plan:
    largeur_m: 40
    profondeur_m: 25

cameras:
  # Valeurs d'exemple : 4 points repérés sur l'image (pixels) et leur position sur le plan (m).
  - id: cam_caisses
    source: data/videos/caisses.mp4
    calibration:
      image: [[120, 650], [1160, 640], [980, 300], [300, 310]]
      plan:  [[12, 0], [22, 0], [22, 6], [12, 6]]

lignes:
  # Sens positif = passage de la droite vers la gauche du segment a→b.
  - id: entree
    label: Porte d'entrée (positif = entrée)
    a: [0, 2]
    b: [4, 2]
  - id: sortie
    label: Sortie après caisses (négatif = sortie)
    a: [12, 0]
    b: [24, 0]

zones:
  - {id: file_caisse_1, type: file_attente, label: File caisse 1, polygone: [[14, 2], [16, 2], [16, 6], [14, 6]]}
  - {id: caisse_1, type: caisse, label: Caisse 1, polygone: [[14, 0], [16, 0], [16, 2], [14, 2]]}
  - {id: file_caisse_2, type: file_attente, label: File caisse 2, polygone: [[18, 2], [20, 2], [20, 6], [18, 6]]}
  - {id: caisse_2, type: caisse, label: Caisse 2, polygone: [[18, 0], [20, 0], [20, 2], [18, 2]]}

  - {id: comptoir_fromage_approche, type: comptoir_approche, label: Fromage — attente, polygone: [[32, 18], [38, 18], [38, 21], [32, 21]]}
  - {id: comptoir_fromage_service, type: comptoir_service, label: Fromage — au comptoir, polygone: [[32, 21], [38, 21], [38, 22.5], [32, 22.5]]}

  - {id: tg_01, type: tete_de_gondole, label: Tête de gondole allée 1, polygone: [[8, 20], [10, 20], [10, 21.5], [8, 21.5]]}

  - {id: allee_01, type: allee, polygone: [[8, 6], [10, 6], [10, 20], [8, 20]]}
  - {id: allee_02, type: allee, polygone: [[12, 6], [14, 6], [14, 20], [12, 20]]}
  - {id: allee_03, type: allee, polygone: [[16, 6], [18, 6], [18, 20], [16, 20]]}
  - {id: allee_04, type: allee, polygone: [[20, 6], [22, 6], [22, 20], [20, 20]]}
  - {id: allee_05, type: allee, polygone: [[24, 6], [26, 6], [26, 20], [24, 20]]}
